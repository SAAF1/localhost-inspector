<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App flows</title>
<link rel="stylesheet" href="./workspace.css">
<script type="module" src="./workspace.mjs"></script>
<body>
<main id="viewport" aria-label="Application and flow canvas">
  <div id="map" hidden></div>
  <iframe id="app-preview" title="Active app frame"></iframe>
  <div id="localhost-inspector-dock"></div>
  <button id="flow-toggle" type="button" aria-label="Expand flow" aria-pressed="false" title="Expand flow" disabled>
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" aria-hidden="true">
      <rect x="1.5" y="6" width="4" height="6" rx="1"/><rect x="7" y="3" width="4" height="12" rx="1"/><rect x="12.5" y="6" width="4" height="6" rx="1"/>
    </svg>
  </button>
  <output id="zoom" hidden></output>
  <output id="notice" aria-live="polite" hidden></output>
</main>
</body>
</html>
